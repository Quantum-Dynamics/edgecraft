site_name: edgecraft
site_description: Quantum Hall edge deformation simulator for analog universe experiments.
site_url: https://Quantum-Dynamics.github.io/edgecraft/
repo_url: https://github.com/Quantum-Dynamics/edgecraft
repo_name: Quantum-Dynamics/edgecraft

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - search.highlight
  language: en

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Theoretical Principles: principles.md
  - API Reference: api.md
